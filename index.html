<!-- index.html (Tela de Login) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Malotes</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .campo {
      margin-bottom: 1rem;
    }

    .titulo {
      text-align: center;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="titulo">Controle de Malotes</h1>
    <form>
      <div class="campo">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome">
      </div>
      <div class="botoes">
        <button type="button" class="btn-acessar" id="btn-acessar">Acessar</button>
      </div>
    </form>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="firebaseConfig.js"></script>
  <script>
    const firebaseConfig = import firebaseConfig from './firebaseConfig.js';
    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();

    document.getElementById("btn-acessar").addEventListener("click", function() {
      const nome = document.getElementById("nome").value;

      auth.signInWithEmailAndPassword(nome, "123456")
        .then((userCredential) => {
          // Signed in
          var user = userCredential.user;
          window.location.href = "relatorio.html";
        })
        .catch((error) => {
          var errorCode = error.code;
          var errorMessage = error.message;
          alert("Erro ao acessar: " + errorMessage);
        });
    });
  </script>
</body>
</html>
